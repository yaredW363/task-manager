<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <p class="subtitle">
            Organize your day, one task at a time.
        </p>


        <!-- Task Input -->
        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <select id="priorityInput">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <button id="addTaskBtn">
                Add Task
            </button>

        </div>


        <!-- Filters -->
        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="active"
            >
                Active
            </button>

            <button
                class="filter"
                data-filter="completed"
            >
                Completed
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList"></ul>


        <!-- Footer -->
        <div class="footer">

            <span id="taskCount">
                0 tasks remaining
            </span>

            <button id="clearCompleted">
                Clear Completed
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
